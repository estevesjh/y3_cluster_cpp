# Read the Docs configuration (private project on RTD for Business).
# Docs: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  # Match the local `sphinx-build -W` check: any warning fails the build.
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
