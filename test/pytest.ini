[pytest]
; *.test.py mirrors the C++ *.test.cc convention -- pytest's default
; discovery pattern (test_*.py / *_test.py) never matches it, and its
; default import mode treats the dot as a package separator, misparsing
; every dotted filename (GitHub issue #25). Without this file, `pytest`
; silently collects nothing and `pytest *.test.py` fails on every file
; with ModuleNotFoundError.
;
; Lives in test/ (not the repo root) so the documented workflow is
; `cd test && pytest`, mirroring `cd release-build && ctest`. pytest
; finds its ini by walking UP from the invocation directory, never down
; into subdirectories -- so this file only takes effect when pytest is
; run from here (or a path under here), not from the repo root.
testpaths = .
python_files = *.test.py
addopts = --import-mode=importlib
