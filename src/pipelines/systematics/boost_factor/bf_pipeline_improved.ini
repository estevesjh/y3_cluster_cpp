[runtime]
sampler = emcee
root = ${COSMOSIS_SRC_DIR}
fatal_errors = T
verbosity = debug

[output]
filename = outputs/bf_y1_all_bins_chain.txt
format = text
verbosity = debug

[emcee]
walkers = 20
samples = 5000
cpus = 4
save_covariance = T

[pipeline]
modules = boost_factor_likelihood
values = bf_values_all_bins.ini
likelihoods = boost_factor_likelihood

[likelihoods]
boost_factor_likelihood = boost_factor_likelihood

[boost_factor_likelihood]
file = bf_likelihood_improved.py
; Real DES Y1 boost-factor data (l0-l3 x z0-z2, 12 bins), copied from
; ~/Documents/GitHub/Boost_factor_cosmosis/data/profiles/ so this pipeline
; is runnable standalone from within y3_cluster_cpp.
data_path = ${Y3_CLUSTER_CPP_DIR}/src/pipelines/systematics/boost_factor/data/y1_profiles
richness_bins = 0,1,2,3
redshift_bins = 0,1,2
n_radial_points = 8
