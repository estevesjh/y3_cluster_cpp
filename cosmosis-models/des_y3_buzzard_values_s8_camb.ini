; Same priors and start point as des_y3_buzzard_values_s8.ini, for CSL camb:
; the amplitude is named sigma_8 (the key camb reads; it ignores sigma8 and
; silently falls back to its default A_s). No A_s / log1e10As here: camb
; rescales A_s to match sigma_8.
[cosmological_parameters]
; min     start      max
h0        = 0.474  0.70       0.872
omega_m   = 0.11   0.286      0.89
omega_b   = 0.02   0.047      0.10
omega_k   = 0.0
tau       = 0.0544
n_s       = 0.83   0.96       1.10
sigma_8   = 0.51   0.82       1.2
w         = -1.0
wa        = 0.0
mnu       = 0.0
num_massive_neutrinos = 0
nnu       = 3.046
neutrino_hierarchy    = 0

[cluster_abundance]
hmf_s = 0.0
hmf_q = 1.0

[cluster_mor]
; min   start        max
log10_Mmin   = 10.0  11.3852818   13.0
log10_ratio  = 1.0   1.3111592    1.5
alpha        = 0.4   0.858693714  1.4
epsilon      = -1.0  0.283887020  1.0
sigma_lambda = 0.05  0.180949022  0.50
; fixed: the mock's pivot (Costanzi Eq. 15); code default is 0.45.
z_pivot      = 0.4544

[photoz]
delta_z = 0.0

; Buzzard clusters sit on the true halo centers: no miscentering.
[miscentering]
f_mis   = 0.0
tau_mis = 0.17
