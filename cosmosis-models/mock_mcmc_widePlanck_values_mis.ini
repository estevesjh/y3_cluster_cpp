; Fiducial widePlanck values + the fixed [miscentering] section that the
; des_y3 shear modules REQUIRE as datablock values (they have no in-code
; fallback — see src/pipelines/des_y3/shear_1h2h/cpp/0d/shear1h2h_max_t.hh).
; f_mis/tau_mis are the Y3 fiducial defaults (F_MIS_DEFAULT/TAU_MIS_DEFAULT
; in src/pipelines/shared/datablock_models.py), i.e. the same values the
; production Shear1hMisSel.so uses in-code, so companion runs stay
; bit-comparable with the canonical real_pipeline_extract_output dump.
%include ${DES_CLUSTER_NERSC_DIR}/cosmosis-models/mock_mcmc_widePlanck_values.ini

[miscentering]
f_mis = 0.22
tau_mis = 0.17

; Costanzi-2026 B_prj(R) selection-bias correction on the max model
; (src/pipelines/systematics/costanzi_bprj/). Read by
; y3_buzzard/likelihood_cp.py only when its ini section sets
; is_b_proj_costanzi26 = T (with shear_max_section = shear1h2h_max);
; inert otherwise. DeltaSigma best-fit values.
[costanzi_bprj]
A = 0.12
alpha = 4.11
beta = 0.18
gamma = 1.82
