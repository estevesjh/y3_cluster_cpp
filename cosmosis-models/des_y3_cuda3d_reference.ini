; CUDA vs C++ twin comparison for the explicit-3d adaptive reference
; backends: NumCounts3d/NumCounts3dGpu (number_counts) and
; Shear1h3d/Shear1h3dGpu (shear_1h2h). Same grids as
; des_y3_cpp3d_slow_reference.ini's NumCounts3d/Shear1h3d sections, run
; back-to-back with their CUDA twins in the SAME execution so the
; precision comparison is not limited by cross-run float reproducibility.
; Drops b_sel_marg/bsel/shear_prj_cuhre/Shear1h2hMax3d -- not needed by
; either module here (only shear_prj_cuhre hard-depends on
; b_sel_marginalised; see the note in des_y3_cpp3d_slow_reference.ini).
;
; Run: cosmosis cosmosis-models/des_y3_cuda3d_reference.ini
; Requires a GPU (NumCounts3dGpu/Shear1h3dGpu).

[runtime]
sampler = test
root = ${COSMOSIS_SRC_DIR}
resume = F

[DEFAULT]
fatal_errors = T
output_section = cluster_observables_full

[test]
save_dir = des_y3_cuda3d_reference_output
save = T

[pipeline]
modules = consistency GrowthFactor cp_camb MfTinker halo_model
          prj_params average_sigma_crit_inv sel_function
          NumCounts3d NumCounts3dGpu
          Shear1h3d Shear1h3dGpu
values = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/cosmosis-models/mock_mcmc_widePlanck_values_mis.ini
quiet = T
debug = F
timing = T

[consistency]
file = ${COSMOSIS_STANDARD_LIBRARY}/utility/consistency/consistency_interface.py

[GrowthFactor]
file = ${COSMOSIS_STANDARD_LIBRARY}/structure/growth_factor/interface.so
zmin = 0.0
zmax = 4.05
dz   = 0.01

[cp_camb]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/src/modules/cp_camb/cp_camb.py
emulator_repo      = /pscratch/sd/j/jesteves/github/camb-emulator/camb-for-cp
linear_pk_path      = /pscratch/sd/j/jesteves/github/camb-emulator/camb-for-cp/models/camb_linear_s8_v3c_emulator.npz
linear_nonu_pk_path = /pscratch/sd/j/jesteves/github/camb-emulator/camb-for-cp/models/camb_linear_nonu_s8_v3c_emulator.npz
zmin = 0.0
zmax = 4.0
nz = 50

[MfTinker]
file = ${COSMOSIS_STANDARD_LIBRARY}/mass_function/mf_tinker/tinker_mf_module.so
redshift_zero = 0
feedback = 0
matter_power_lin_version = 2

[halo_model]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/y3_buzzard/halo_model_cosmosis.py
z_halo = 0.0
R_perp_min = 0.1
R_perp_max = 20.0
R_perp_bins = 128
Radii_min = 1.0
Radii_max = 35.0
Radii_bins = 128
M_min = 1.0e12
M_max = 1.0e16
M_bins = 100
compute_lensing_1h = T
compute_lensing_2h = F

[prj_params]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/src/pipelines/systematics/selection_function/prj_params.py

[average_sigma_crit_inv]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/src/modules/average_sigma_crit_inv/average_sigma_crit_inv.py
z_min = 0.05
z_max = 0.80
z_bins = 50
unity = T

[sel_function]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/src/pipelines/systematics/selection_richness/python/sel_function.py
lam_min = 20.0  30.0  45.0  60.0   20.0  30.0  45.0  60.0   20.0  30.0  45.0  60.0
lam_max = 30.0  45.0  60.0  200.0  30.0  45.0  60.0  200.0  30.0  45.0  60.0  200.0
zob_min = 0.20  0.20  0.20  0.20   0.35  0.35  0.35  0.35   0.50  0.50  0.50  0.50
zob_max = 0.35  0.35  0.35  0.35   0.50  0.50  0.50  0.50   0.65  0.65  0.65  0.65
sigma_z = 0.03  0.03  0.03  0.03   0.03  0.03  0.03  0.03   0.03  0.03  0.03  0.03
zt_low   = 0.05
zt_high  = 0.80
lnm_low  = 29.9336
lnm_high = 36.8414
n_lnm = 192
n_z   = 20
n_z_shared = 64
L_z    = 6.0
L_lam  = 6.0
N_q    = 32

; ========================================================================
; Explicit-3d reference, full 12-bin wall. CPU: Cuhre eps_rel=1e-4
; (project-accepted setting). GPU: PAGANI, same eps_rel/eps_abs.
; ========================================================================
[NumCounts3d]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/release-build/src/modules/des_y3_numcounts_3d_cpp/NumCounts3d.so
algorithm = cuhre
eps_rel = 1e-4
eps_abs = 1e-12
max_eval = 10000000
use_cartesian_product = F
