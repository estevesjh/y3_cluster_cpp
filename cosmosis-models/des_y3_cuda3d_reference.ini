zt_low   = 0.05  0.05  0.05  0.05  0.05  0.05  0.05  0.05  0.05  0.05  0.05  0.05
zt_high  = 0.80  0.80  0.80  0.80  0.80  0.80  0.80  0.80  0.80  0.80  0.80  0.80
lnm_low  = 29.9336 29.9336 29.9336 29.9336 29.9336 29.9336 29.9336 29.9336 29.9336 29.9336 29.9336 29.9336
lnm_high = 36.7300 36.7300 36.7300 36.7300 36.7300 36.7300 36.7300 36.7300 36.7300 36.7300 36.7300 36.7300

[NumCounts3dGpu]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/release-build/src/modules/des_y3_numcounts_3d_cuda/NumCounts3dGpu.so
algorithm = pagani
eps_rel = 1e-4
