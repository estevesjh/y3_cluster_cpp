; GPU-language companion of des_y3_cpp0d_fast_apriori.ini: the two
; fixed-GL (0d) CUDA backends that actually exist --
; Shear1h2hMaxGpu.so (traditional max model, 2-dim GL) and
; ShearPrjFrozenGpu.so (frozen-physics projection shear). There is no
; 0d CUDA backend for number counts (see
; number_counts/README.md: "a one-dimensional mass contraction does
; not justify a GPU kernel"), so this ini only covers the two
; observables that have one. Same 1000-draw apriori sweep over the
; full mock_mcmc_widePlanck_values_mis.ini prior, same nz=50 for
; cp_camb, as the cpp/python 0d companions.
;
; ShearPrjFrozenGpu's cl channel has a known, documented defect
; (docs/known_issues/frozen_physics_signed_rnd_defect.md) -- this run
; is for the COST distribution only, not a precision claim.
;
; Run: cosmosis cosmosis-models/des_y3_gpu0d_fast_apriori.ini
; Requires a GPU.

[runtime]
sampler = apriori
root = ${COSMOSIS_SRC_DIR}
resume = F

[DEFAULT]
fatal_errors = T
output_section = cluster_observables_full

[apriori]
nsample = 1000

[output]
filename = des_y3_gpu0d_fast_apriori.txt
format = text
verbosity = 0

[pipeline]
modules = consistency GrowthFactor cp_camb MfTinker halo_model
          average_sigma_crit_inv sel_function
          b_sel_marg bsel
          Shear1h2hMaxGpu
          ShearPrjFrozenGpu
values = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/cosmosis-models/mock_mcmc_widePlanck_values_mis.ini
quiet = T
debug = F
timing = T

[consistency]
file = ${COSMOSIS_STANDARD_LIBRARY}/utility/consistency/consistency_interface.py

[GrowthFactor]
file = ${COSMOSIS_STANDARD_LIBRARY}/structure/growth_factor/interface.so
zmin = 0.0
zmax = 4.05
dz   = 0.01

[cp_camb]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/src/modules/cp_camb/cp_camb.py
emulator_repo      = /pscratch/sd/j/jesteves/github/camb-emulator/camb-for-cp
linear_pk_path      = /pscratch/sd/j/jesteves/github/camb-emulator/camb-for-cp/models/camb_linear_s8_v3c_emulator.npz
linear_nonu_pk_path = /pscratch/sd/j/jesteves/github/camb-emulator/camb-for-cp/models/camb_linear_nonu_s8_v3c_emulator.npz
zmin = 0.0
zmax = 4.0
nz = 50

[MfTinker]
file = ${COSMOSIS_STANDARD_LIBRARY}/mass_function/mf_tinker/tinker_mf_module.so
redshift_zero = 0
feedback = 0
matter_power_lin_version = 2

[halo_model]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/y3_buzzard/halo_model_cosmosis.py
z_halo = 0.0
R_perp_min = 0.1
R_perp_max = 20.0
R_perp_bins = 128
Radii_min = 1.0
Radii_max = 35.0
Radii_bins = 128
M_min = 1.0e12
M_max = 1.0e16
M_bins = 100
compute_lensing_1h = T
compute_lensing_2h = T

[average_sigma_crit_inv]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/src/modules/average_sigma_crit_inv/average_sigma_crit_inv.py
z_min = 0.05
z_max = 0.80
z_bins = 50
unity = T

[sel_function]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/src/pipelines/systematics/selection_richness/python/sel_function.py
lam_min = 20.0  30.0  45.0  60.0   20.0  30.0  45.0  60.0   20.0  30.0  45.0  60.0
lam_max = 30.0  45.0  60.0  200.0  30.0  45.0  60.0  200.0  30.0  45.0  60.0  200.0
