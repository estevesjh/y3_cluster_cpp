[likelihoods]
file = ${Y3_CLUSTER_CPP_DIR}/src/pipelines/buzzard/likelihoods/likelihood_cp.py
; Buzzard mock data vector from Tang Xin's notebook (xtang126/mock_cluster_buzzard PR #2:
; richness from M200m, fixed little-h Sigma_crit^-1), cell "Pipeline-ready data vector":
;   data_NC (12): N(lambda_ob, z_ob) on 5025.6 deg^2, diagonal Poisson invcov
;   data_Shear (120): stacked DeltaSigma, comoving h Msun/pc^2, on the r_perp grid above,
;                     bins z-major, R fast; 50-patch jackknife covariance per bin
; The stack has no selection bias, miscentering or boost dilution, matching the max model
; with f_mis = 0.
filename = ${Y3_CLUSTER_CPP_DIR}/data/mock/dv_buzzard_m200m_pipeline.npz
; Inner scale cut: Buzzard's measured profiles fall below NFW inside ~0.25 physical Mpc
; (resolution floor); drops R = 0.200 and 0.286 cMpc/h, the covariance is cut then inverted.
shear_r_min = 0.3
; Max-model mode: theory = shear1h2hmax3d/vals / numcounts3d/vals (no projection term).
num_counts_section = numcounts3d
shear_max_section = shear1h2hmax3d
verbose = F
log_space = F
