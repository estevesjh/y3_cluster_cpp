; R fast, with one (lt, zt, lnM) integration volume per row.  Writes shear1h2hmax3d/vals (120).
; include_miscentering (default T) uses miscentering/f_mis from the values file (0 for Buzzard).
file = ${Y3_CLUSTER_CPP_DIR}/release-build/src/modules/des_y3_shear1h_3d_cpp/Shear1h2hMax3d.so
algorithm = cuhre
eps_rel = 1e-4
