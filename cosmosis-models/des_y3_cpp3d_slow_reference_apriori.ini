; Apriori-sampled companion of the cpp/3d leg of des_y3_cpp_python.ini
; and des_y3_cpp_gpu.ini (the standalone des_y3_cpp3d_slow_reference.ini
; this file used to pair with was folded into those two combined
; files): same adaptive Cuhre 3d/2d pipeline (NumCounts3d, Shear1h3d,
; Shear1h2hMax3d,
; shear_prj_cuhre), drawn 10 times from the [values] priors instead of
; evaluated once at the fiducial point -- few samples because each one
; costs ~228 s (dominated by shear_prj_cuhre's reduced 3-point wall at
; ~72 s/pt). Purpose: see how much the adaptive-3d numbers move across
; the prior, as a sanity check on whether the single fiducial-point
; precision numbers in the README generalize. nz=50 for cp_camb's
; Pk(k,z) grid (same as the non-apriori original; do not raise to the
; production nz=400 here).
;
; [apriori] save writes the FULL DataBlock per sample (10 dirs, cheap at
; this sample count -- do NOT copy this `save` pattern into the fast
; 1000-sample ini, which would explode into ~150k small files on
; Lustre).
;
; Run: cosmosis cosmosis-models/des_y3_cpp3d_slow_reference_apriori.ini
; Requires a GPU-equipped node only insofar as the underlying build does
; (these particular modules are CPU/Cuhre, not CUDA).

[runtime]
sampler = apriori
root = ${COSMOSIS_SRC_DIR}
resume = F

[DEFAULT]
fatal_errors = T
output_section = cluster_observables_full

[apriori]
nsample = 10
save = des_y3_cpp3d_slow_reference_apriori_output/sample

[output]
filename = des_y3_cpp3d_slow_reference_apriori_output/chain.txt
format = text
verbosity = 1
lock = F

[pipeline]
; shear_prj_cuhre's set_sample() hard-depends on the b_sel_marginalised
; section; see des_y3_cpp_python.ini's [pipeline] comment for the full
; rationale (des_y3_cpp3d_slow_reference.ini, where this note
; originated, was folded into that combined file).
modules = consistency GrowthFactor cp_camb MfTinker halo_model
          prj_params average_sigma_crit_inv sel_function
          b_sel_marg bsel
          NumCounts3d Shear1h3d Shear1h2hMax3d shear_prj_cuhre
values = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/cosmosis-models/mock_mcmc_widePlanck_values_mis.ini
quiet = T
debug = F
timing = T

[consistency]
file = ${COSMOSIS_STANDARD_LIBRARY}/utility/consistency/consistency_interface.py

[GrowthFactor]
file = ${COSMOSIS_STANDARD_LIBRARY}/structure/growth_factor/interface.so
zmin = 0.0
zmax = 4.05
dz   = 0.01

[cp_camb]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/src/modules/cp_camb/cp_camb.py
emulator_repo      = /pscratch/sd/j/jesteves/github/camb-emulator/camb-for-cp
linear_pk_path      = /pscratch/sd/j/jesteves/github/camb-emulator/camb-for-cp/models/camb_linear_s8_v3c_emulator.npz
linear_nonu_pk_path = /pscratch/sd/j/jesteves/github/camb-emulator/camb-for-cp/models/camb_linear_nonu_s8_v3c_emulator.npz
zmin = 0.0
zmax = 4.0
nz = 50

[MfTinker]
file = ${COSMOSIS_STANDARD_LIBRARY}/mass_function/mf_tinker/tinker_mf_module.so
redshift_zero = 0
feedback = 0
matter_power_lin_version = 2

[halo_model]
