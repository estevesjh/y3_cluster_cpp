; Values ini for the physics_validation_{pipelines,camb}.ini pair.
; The widePlanck fiducial point (start values of des-cluster-nersc
; cosmosis-models/mock_mcmc_widePlanck_values.ini), pinned as deltas:
; both runs must evaluate the SAME cosmology so the CAMB-vs-cp_camb
; residuals in physics_validation.html are pure-emulator checks.
;
; Amplitude parameterization: sigma8 (the s8 cp_camb emulators sample
; sigma8 directly). The CAMB companion consumes the same number via
; sigma_8_input (CSL camb_interface rescales A_s to hit it); log1e10As
; is the initial A_s guess for that rescale, not an independent input.

[cosmological_parameters]
h0        = 0.6766
omega_m   = 0.311049
omega_b   = 0.048975
omega_k   = 0.0
tau       = 0.0544
n_s       = 0.9665
sigma8        = 0.8238
sigma_8_input = 0.8238
log1e10As     = 3.0448
w         = -1.0
wa        = 0.0
mnu       = 0.0
num_massive_neutrinos = 0
nnu       = 3.046
neutrino_hierarchy    = 0
; mnu=0 mandatory for cp_camb apples-to-apples: cp_camb uses
; scale-independent D(z), CAMB's delta_cb growth becomes scale-dependent
; with massive neutrinos (see docs/emulator_validation.tex Sec.~1).

; HMF_t reads these; s=0, q=1 collapses the multiplier to 1.
[cluster_abundance]
hmf_s = 0.0
hmf_q = 1.0

; widePlanck HOD fiducial (log10_ratio parameterization; MOR_HOD_t,
; sel_function.py and bsel.py all prefer log10_ratio when present).
[cluster_mor]
log10_Mmin   = 11.4
log10_ratio  = 1.3
alpha        = 0.86
epsilon      = 0.0
sigma_lambda = 0.18

; Used by average_sigma_crit_inv.py. delta_z shifts the source-bin p(z).
[photoz]
delta_z = 0.0

; DES-Y3 fiducial redMaPPer miscentering calibration. REQUIRED by the
; des_y3 pipeline lensing modules (Shear1hGl) — they have no in-code
; fallback (see src/pipelines/des_y3/shear_1h2h/cpp/0d/shear1h_gl_t.hh).
[miscentering]
f_mis   = 0.22
tau_mis = 0.17
