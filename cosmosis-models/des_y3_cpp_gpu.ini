; Combined cpp + gpu correctness comparison: fast(0d fixed-GL/frozen)
; and slow(3d adaptive Cuhre/PAGANI) legs, all in one CosmoSIS run so
; every backend sees the identical cosmology/halo-model/selection
; sample. Consolidates des_y3_cpp0d_fast.ini + des_y3_gpu0d_fast_apriori.ini
; (module set, run here at a single fiducial point instead of the
; 1000-draw apriori sweep) + des_y3_cpp3d_slow_reference.ini +
; des_y3_cuda3d_reference.ini into one file (see
; review/2026-09-04/pr7_files_checklist.md for the discussion).
;
; NO GPU NUMBER-COUNTS LEG, on purpose: there is no 0d CUDA number-counts
; module ("a one-dimensional mass contraction does not justify a GPU
; kernel", des_y3/number_counts/README.md), and this file deliberately
; skips NumCounts3dGpu too so the GPU side stays limited to the two
; observables (shear_1h2h max model, shear projection) that actually
; have both a fast(0d) and slow(3d) CUDA backend. Number counts is
; cpp-only here (NumCountsSel/NumCountsSijGl fast, NumCounts3d slow) --
; see des_y3_cpp_python.ini for its python-side comparison instead.
;
; Same put_val-collision check as des_y3_cpp_python.ini: every module
; below has its own module_label()-derived output section, verified
; against src/utils/CosmoSISScalarIntegrationModule.hh -- no collisions.
;
; GPU shear1h2h_max/shear_prj sections carry their known caveats
; unchanged from des_y3_gpu0d_fast_apriori.ini: ShearPrjFrozenGpu's cl
; channel has a documented defect (see PR discussion / known-issue
; history), so treat this file's GPU projection numbers as a cost/
; identity check, not a precision claim.

[runtime]
sampler = test
root = ${COSMOSIS_SRC_DIR}
resume = F

[DEFAULT]
fatal_errors = T
output_section = cluster_observables_full

[test]
save_dir = des_y3_cpp_gpu_output
save = T

[pipeline]
modules = consistency GrowthFactor cp_camb MfTinker halo_model
          prj_params average_sigma_crit_inv sel_function
          b_sel_marg bsel
          NumCountsSel Shear1hMisSel
          NumCountsSijGl Shear1hGl
          ShearPrjGl
          Shear1h2hMax
          Shear1h2hMaxGpu
          ShearPrjFrozenGpu
          NumCounts3d Shear1h3d Shear1h2hMax3d shear_prj_cuhre
          Shear1h3dGpu
values = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/cosmosis-models/mock_mcmc_widePlanck_values_mis.ini
