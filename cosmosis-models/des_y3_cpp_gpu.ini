; NOTE (Shear1h3d/Shear1h2hMax3d grid, below): shear1h_3d_t.hh's own
; header spells out the contract -- "bin_index and r_perp arrays of
; length n_bins * n_R (bin slow, R fast), with the volume arrays
; repeated per radius" -- i.e. use_cartesian_product = F with the grid
; and the lt/zt/lnm volumes BOTH zipped to the same length as the
; (bin, R) wall. lam_min/lam_max/zob_min/zob_max/sigma_z stay the full
; 12-entry per-BIN-LABEL lookup (indexed by the bin_index VALUE at
; runtime, not by grid position) -- do not shrink them to match a
; reduced wall. The full 12-bin x 10-radius wall (120 points) at
; 25-95 s/point is 50-190 min, too slow for an interactive login-node
; run, so (following the ShearPrjCuhre precedent below) this is
; reduced to a 6-point wall: inner/mid/outer radius at the two extreme
; (richness, redshift) corners -- bin 0 (low lam, low z) and bin 11
; (high lam, high z). Full-grid wall-clock = per-point cost x 120 (not
; run here -- see the ShearPrjCuhre note below, issue #23).

