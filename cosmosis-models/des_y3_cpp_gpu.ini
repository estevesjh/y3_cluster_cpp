; NOTE (all three modules below): the *_3d_t.hh headers document the
; validated contract directly (num_counts_3d_t.hh, shear1h_3d_t.hh,
; shear1h2h_max_3d_t.hh) and src/pipelines/des_y3/number_counts/README.md
; names the accepted setting explicitly (eps_rel=1e-3 is rejected --
; it can undercount the lowest-richness bin; eps_rel=1e-4 is the
; accepted setting, echoed in shear_1h2h/README.md's 3d row).
; use_cartesian_product = F is what NumCounts3d's own header prescribes
; ("the standard integration-module knobs ... use_cartesian_product =
; F") -- with F, the lt/zt/lnm volume arrays are ZIPPED 1:1 against the
; grid, so they must be per-grid-point arrays (repeating the shared
; window once per point), not scalars. lt is lambda_true (richness),
; NOT a copy of the zt window -- num_counts_3d_t.hh: "the lt volume
; must cover the HOD support inside the mass envelope (lt_high ~ 2000
; at the Y3 fiducial)"; lt_low must stay strictly positive (EMG
; singularity at lt=0).
[NumCounts3d]
file = /pscratch/sd/j/jesteves/github/y3_cluster_cpp_dev/release-build/src/modules/des_y3_numcounts_3d_cpp/NumCounts3d.so
