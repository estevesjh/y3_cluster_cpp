[pytest]
; test/*.test.py mirrors the C++ *.test.cc convention -- pytest's default
; discovery pattern (test_*.py / *_test.py) never matches it, and its
; default import mode treats the dot as a package separator, misparsing
; every dotted filename (GitHub issue #25). Without this file, `pytest
; test/` silently collects nothing and `pytest test/*.test.py` fails on
; every file with ModuleNotFoundError.
testpaths = test
python_files = *.test.py
addopts = --import-mode=importlib
