;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; This is a GPU Cosmosis pipeline for testing the shear projection modules
; Author: Arwa Abdulghafour 
; refrences I used for this pipeline: 
;   - Y3 cluster cosmology pipeline: Estevesjh. 2026 --> docs/pipeline_modules.tex
;   - this is to test the preduction of shear profile 
;   - shear1hmissel --> the first halo term 
;   - shear_prj --> the 2ed projected halo + b_sel 
;   - shear projection module: Costanzi et al. 2026
;   
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[runtime]
sampler = test
root = ${COSMOSIS_SRC_DIR}

[DEFAULT]
fatal_errors = T
CSL = ${COSMOSIS_STANDARD_LIBRARY}

[test]
save_dir = shearTot_pipeline_test_output

[pipeline]

; Correct shear production flow:
;   NumCountsSel     -> N_i[1]
;   Shear1hMisSel    -> N_i[gamma_1h_full](R)
;   shear_prj        -> gamma_prj(R)
;
; Final theory shear is gamma_theory = shear1hmissel/numcountssel + shear_prj
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; might need to fix: b/c  The formula itself has a bug: the halo mass function is read at roughly
; the wrong mass (missing `+ ln(Omega_m - Omega_nu)` shift, matching a
; pitfall already flagged in `CLAUDE.md`).
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; PORT NOTE (des_y3 merge): four changes to this list.
;  1. bSelMargGPU -> bselmarggpu. The C++ reads its config under the
;     hardcoded label "bselmarggpu" (bSelMargGPU.cu read_config), and the
;     section below is [bselmarggpu], so the old spelling never resolved.
;  2. sigmaCritInv (y3_buzzard/buildSigmaCritInv.py) -> average_sigma_crit_inv.
;     ShearPrjGl reads average_sigma_crit_inv/zlense to turn DSigma into
;     gamma_t; buildSigmaCritInv publishes a different observable.
;  3. + ShearPrjGl -- our fixed-GL DSigma_prj, running on the SAME datablock
;     so its output can be compared against shear_prj element-for-element.
;  4. module order puts bselmarggpu BEFORE both projection modules: it
;     writes b_sel_marginalised/{lob,zob,b_small,b_large}, which shear_prj
;     (SigmaPrjGPU::set_sample) and ShearPrjGl (ShearPrjCore) both read.
;     CosmoSIS put_val does not overwrite, so whoever writes that section
;     first wins -- here it is deliberately Arwa's GPU b_sel, which means
;     BOTH projection backends consume identical B_small/B_large and the
;     comparison isolates the projection integral itself.
; PORT NOTE (added back): [sigmaCritInv] (y3_buzzard/buildSigmaCritInv.py)
; was in Arwa's original modules list, right after halo_model, and was
; dropped when average_sigma_crit_inv was added for ShearPrjGl's sake --
; but GAMMA_1H_NFW (src/models/gamma_1h_nfw.cuh, used inside
; shear1hmissel_t/Shear1hMisSel.cu) hardcodes reading the OLD
; "sigmaCritInv" section (r_sigma x z 2-D grid), not average_sigma_crit_inv
; (z-only zlense/sci_average). Without it shear1hmissel crashes with
; BadDataBlockAccess. Restored exactly as she had it; average_sigma_crit_inv
; stays for ShearPrjGl -- the two modules write to different sections.
modules = consistency camb mstar mf_tinker prj_params halo_model sigmaCritInv average_sigma_crit_inv numberCountsFull_t shear1hmissel bselmarggpu shear_prj ShearPrjGl boost_factor

values = ${Y3_CLUSTER_CPP_DIR}/cosmosis_tests/gpu_prj_costanzi2026/values_gpu.ini
likelihoods =
extra_output =
quiet = F
debug = T
timing = T

; =============================================================================
; COSMOLOGY MODULES
; =============================================================================

[consistency]
file = %(CSL)s/utility/consistency/consistency_interface.py

[camb]
file = %(CSL)s/boltzmann/camb/camb_interface.py
mode = all
lmax = 2500
feedback = 0
zmin = 0.0
zmax = 4.0
nz = 50
kmin = 1e-4
kmax = 50.0
nk = 200
halofit_version = takahashi
nonlinear = both

[mstar]
file = %(CSL)s/boltzmann/sigma_cpp/sigma_cpp.py
matter_power = matter_power_nl
zmax = 1.0
zmin = 0.0
dz = 0.1
rmin = 0.01
rmax = 20.5
dr = 0.5

[mf_tinker]
file = %(CSL)s/mass_function/mf_tinker/tinker_mf_module.so
redshift_zero = 0
feedback = 0

; =============================================================================
; PROJECTION / HALO MODEL INPUTS
; =============================================================================

[prj_params]
; PORT NOTE: y3_buzzard/ is local scratch (CLAUDE.md); the canonical
; copy lives under src/pipelines.
file = ${Y3_CLUSTER_CPP_DIR}/src/pipelines/systematics/selection_function/prj_params.py

[halo_model]
; PORT NOTE: canonical halo_model. Publishes haloModel/rho_m_ref, which
; the patched sigma_prj_gpu_t.cuh and ShearPrjCore both normalise on.
file = ${Y3_CLUSTER_CPP_DIR}/src/pipelines/cosmology/halo_model.py
R_perp_min = 0.1
R_perp_max = 30.0
R_perp_bins = 50
Radii_min = 1.0
Radii_max = 35.0
Radii_bins = 50
M_min = 1e12
M_max = 1e16
M_bins = 50
compute_lensing_1h = T
compute_lensing_2h = F

; PORT NOTE: added ALONGSIDE [sigmaCritInv] below (not a replacement --
; see the modules-line note above). Publishes average_sigma_crit_inv/
; {zlense, sci_average}; ShearPrjGl needs it for gamma_t^prj. Config copied
; from cosmosis-models/physics_validation_pipelines.ini.
[average_sigma_crit_inv]
file = ${Y3_CLUSTER_CPP_DIR}/src/modules/average_sigma_crit_inv/average_sigma_crit_inv.py
z_min = 0.05
z_max = 0.80
z_bins = 50

; PORT NOTE (restored): from Arwa's original shearTot_pipeline.ini
; (upstream gpu_prj_pipeline_costanzi2026 branch, tip 3a713e9) -- dropped
; during the merge, needed by GAMMA_1H_NFW (see modules-line note above).
; File and beta_lut are unchanged from her original.
[sigmaCritInv]
file = ${Y3_CLUSTER_CPP_DIR}/y3_buzzard/buildSigmaCritInv.py
beta_lut = ${Y3_CLUSTER_CPP_DIR}/data/beta_sigCrit_lut_mock_buzzard_zl.npz
is_delta_sigma = F


; =============================================================================
; NUMERATOR NORMALIZATION: NumCountsSel gives N_i[1]
; =============================================================================

[numberCountsFull_t]
; Update this path if your build places the .so somewhere else.
file = ${Y3_CLUSTER_CPP_DIR}/release-build/src/modules/gpu_prj_costanzi2026/numberCountsFull_t.so

ltr_low = 1.0
ltr_high = 200.0
zt_low = 0.1
zt_high = 0.8
lnm_low = 31.0
lnm_high = 36.0

; Same 12 bin order used by shear1hmissel: richness-major, then redshift.
lob_bin_low  = 20.0 20.0 20.0   30.0 30.0 30.0   45.0 45.0 45.0   60.0 60.0 60.0
lob_bin_high = 30.0 30.0 30.0   45.0 45.0 45.0   60.0 60.0 60.0   200.0 200.0 200.0
zo_low      = 0.20 0.35 0.50   0.20 0.35 0.50   0.20 0.35 0.50   0.20 0.35 0.50
zo_high     = 0.35 0.50 0.65   0.35 0.50 0.65   0.35 0.50 0.65   0.35 0.50 0.65

eps_rel = 1e-2
eps_abs = 1e-10
max_eval = 5.0e6
algorithm = pagani
use_cartesian_product = true

; =============================================================================
; 1-HALO SHEAR NUMERATOR: Shear1hMisSel gives N_i[gamma_1h_full](R)
; =============================================================================

[shear1hmissel]
file = ${Y3_CLUSTER_CPP_DIR}/release-build/src/modules/gpu_prj_costanzi2026/shear1hmissel_t.so
ltr_low = 1.0
ltr_high = 200.0
zt_low = 0.1
zt_high = 0.8
lnm_low = 31.0
lnm_high = 36.0

