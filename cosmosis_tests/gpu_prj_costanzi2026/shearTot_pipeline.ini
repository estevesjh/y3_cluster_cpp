; R = 0.5,1,2,5,10) in lambda-major order. Widened to the SAME 120-row
; wall [shear_prj] and [ShearPrjGl] use -- same 10 radii (0.10-10.00
; cMpc/h) AND the same row order (z-major, then lambda, then radius).
; Her original invariant was that the 1-halo and projection legs shared
; one wall so gamma_theory = shear1hmissel/numcountssel + shear_prj
; assembles element-for-element; moving shear_prj onto the ShearPrjGl
; wall broke that, and this restores it.
