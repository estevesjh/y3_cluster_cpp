; this is for test sampler 


[cosmological_parameters]
h0 = 0.7
omega_m = 0.286
omega_b = 0.047
omega_k = 0.0

; Neutrinos
nnu = 3.046
omega_nu = 0.0

; Inflation
n_s = 0.96
log1e10As = 3.092918

; Reionization
tau = 0.08

; Dark energy
w = -1.0
wa = 0.0

[cluster_abundance]
; Mass-observable relation (Costanzi MOR)
; P(lambda | M, z) - skewed lognormal distribution
; Parameters following mor_des_log_t.cuh conventions:
; - mor_logMmin: log10(M_min) - minimum halo mass to host central galaxy
; - mor_logRatio: log10(M1/M_min) - ratio of characteristic mass to min mass
; - mor_alpha: slope of mass-richness relation
; - mor_sigma: intrinsic scatter
; - mor_epsilon: redshift evolution power
; - z_mor_pivot: pivot redshift
mor_logMmin = 11.3852818
mor_logRatio = 1.3111592
mor_alpha = 0.858693714
mor_sigma = 0.180949022
mor_epsilon = 0.0
z_mor_pivot = 0.4544

; HMF scaling parameters
hmf_s = 0.00
hmf_q = 1.00

; Centering fraction (for miscentering)
; NOTE: fcen/roffset_tau here are read by the legacy Y1 CPU models
; (dsigma_full.cuh, sigma_mis_joint.cuh, roffset_t.hh) -- NOT by
; shear1hmissel (see [miscentering] below, which is what gamma_1h_nfw.cuh
; actually reads for this GPU pipeline). fcen=1.0 here just keeps those
; unrelated legacy modules at their old no-miscentering behaviour.
fcen = 1.0
roffset_tau = 0.17

[cluster_mor]
; These are derived from cluster_abundance parameters above
log10_Mmin = 11.3852818
log10_M1 = 12.696441
alpha = 0.858693714
epsilon = 0.0
sigma_lambda = 0.180949022
z_pivot = 0.4544

[photoz]
; Photo-z uncertainty for K(zo|z) kernel
; Note: sigma_z is a single value; z-dependent values are handled in the module
sigma_z = 0.01

; Photo-z bias (systematic shift in redshift estimate)
; delta_z = 0 means no systematic bias: z_obs = z_true + scatter
; Non-zero values shift the photo-z distribution: z_obs = z_true + delta_z + scatter
; Used by average_sigma_crit_inv to compute lensing efficiency
delta_z = 0.0

[miscentering]
; Read by src/models/gamma_1h_nfw.cuh (shear1hmissel's 1-halo term).
; f_mis = 1 - f_cen (Zhang et al. 2019 / arXiv:2002.11124 Sec. "Cluster
; centering": f_cen = 0.75 +/- 0.08 -> f_mis ~ 0.22-0.25). R_mis =
; tau_mis * R_lambda(lambda^ob), R_lambda = (lambda^ob/100)^0.2 [h^-1 Mpc].
; DES-Y3 fiducial defaults; matches src/modules/num_counts_sel/
; lensing_weights.hh's mis_detail::F_MIS_DEFAULT / TAU_MIS_DEFAULT.
f_mis = 0.22
tau_mis = 0.17

[boost_factor]
rs_l0_z0 = 0.2604
b0_l0_z0 = 0.2227
rs_l0_z1 = 0.1852
b0_l0_z1 = 0.1189
rs_l0_z2 = 0.1089
b0_l0_z2 = 0.1788
rs_l1_z0 = 0.4941
b0_l1_z0 = 0.1759
rs_l1_z1 = 0.3469
b0_l1_z1 = 0.0826
rs_l1_z2 = 0.1307
b0_l1_z2 = 0.2253
rs_l2_z0 = 0.4753
b0_l2_z0 = 0.2151
rs_l2_z1 = 0.3285
b0_l2_z1 = 0.1049
rs_l2_z2 = 0.3630
b0_l2_z2 = 0.0802
rs_l3_z0 = 0.5434
b0_l3_z0 = 0.2628
rs_l3_z1 = 0.7869
b0_l3_z1 = 0.0582
rs_l3_z2 = 0.4327
b0_l3_z2 = 0.0965
