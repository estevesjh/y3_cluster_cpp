[runtime]
sampler = test
root = ${COSMOSIS_SRC_DIR}

[DEFAULT]
fatal_errors = T
CSL = ${COSMOSIS_STANDARD_LIBRARY}

[test]
save_dir = number_counts_full_output

[pipeline]
; 3D GPU integration pipeline for number counts.
; Integrates over (ltr, zt, lnM).
; Observed richness bin probability is read from INT_LC_LT_DES_t2 tables.
modules = consistency camb mf_tinker numberCountsFull_t

values = ${Y3_CLUSTER_CPP_DIR}/cosmosis_tests/gpu/values_simple_gpu.ini
likelihoods =
extra_output =
quiet = F
debug = T
timing = T

; =============================================================================
; COSMOLOGY MODULES
; =============================================================================

[consistency]
file = %(CSL)s/utility/consistency/consistency_interface.py

[camb]
file = %(CSL)s/boltzmann/camb/camb_interface.py
mode = all
lmax = 2500
feedback = 0
zmin = 0.0
zmax = 1.0
nz = 100
kmin = 1e-4
kmax = 50.0
nk = 500
halofit_version = takahashi
nonlinear = pk

[mf_tinker]
file = %(CSL)s/mass_function/mf_tinker/tinker_mf_module.so
redshift_zero = 0
feedback = 0

; =============================================================================
; NUMBER COUNTS GPU MODULE
; =============================================================================

[numberCountsFull_t]
file = ${Y3_CLUSTER_CPP_DIR}/release-build/src/modules/gpu_modules/numberCountsFull_t.so

; Integration bounds for 3D volume: (ltr, zt, lnM)
; Observed richness bin is handled by INT_LC_LT_DES_t2.

ltr_low = 1.0
ltr_high = 300.0

zt_low = 0.1
zt_high = 0.8

lnm_low = 31.0
lnm_high = 36.0

; Full 12-bin configuration:
; Richness bins: [20,30], [30,45], [45,60], [60,200]
; Redshift bins: [0.20,0.35], [0.35,0.50], [0.50,0.65]

lob_bin_low  = 20.0 20.0 20.0   30.0 30.0 30.0   45.0 45.0 45.0   60.0  60.0  60.0
lob_bin_high = 30.0 30.0 30.0   45.0 45.0 45.0   60.0 60.0 60.0   200.0 200.0 200.0

zo_low       = 0.20 0.35 0.50   0.20 0.35 0.50   0.20 0.35 0.50   0.20  0.35  0.50
zo_high      = 0.35 0.50 0.65   0.35 0.50 0.65   0.35 0.50 0.65   0.35  0.50  0.65

; Integration settings
eps_rel = 1e-2
eps_abs = 1e-10
max_eval = 5.0e6
algorithm = pagani