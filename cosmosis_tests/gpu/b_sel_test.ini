[runtime]
sampler = test
root = ${COSMOSIS_SRC_DIR}

[DEFAULT]
fatal_errors = T
CSL = ${COSMOSIS_STANDARD_LIBRARY}

[test]
save_dir = b_sel_test_output

[pipeline]
; Pipeline to test b_sel(theta | lob, ltr, zob)
; Runs: consistency -> camb -> mf_tinker -> haloModel -> bSelMargGPU -> bSelTest
modules = consistency camb mf_tinker haloModel bSelMargGPU bSelTest
values = ${Y3_CLUSTER_CPP_DIR}/cosmosis_tests/gpu/values_b_sel_test.ini
likelihoods =
extra_output =
quiet = F
debug = T
timing = T

; =============================================================================
; COSMOLOGY MODULES
; =============================================================================

[consistency]
file = %(CSL)s/utility/consistency/consistency_interface.py

[camb]
file = %(CSL)s/boltzmann/camb/camb_interface.py
mode = all
lmax = 2500
feedback = 0
zmin = 0.0
zmax = 1.0
nz = 100
kmin = 1e-4
kmax = 50.0
nk = 500
halofit_version = takahashi
nonlinear = pk

[mf_tinker]
file = %(CSL)s/mass_function/mf_tinker/tinker_mf_module.so
redshift_zero = 0
feedback = 0

; =============================================================================
; HALO MODEL (provides haloModel/bias and xi_nl)
; =============================================================================

[haloModel]
file = ${Y3_CLUSTER_CPP_DIR}/y3_buzzard/halo_model_cosmosis.py

; R_perp grid for projected quantities (Mpc/h)
R_perp_min = 0.1
R_perp_max = 100.0
R_perp_bins = 50

; Radii grid for xi(r) (Mpc/h)
Radii_min = 0.01
Radii_max = 200.0
Radii_bins = 100

; Mass grid (Msun/h)
M_min = 1e12
M_max = 1e16
M_bins = 50

; Only need bias and xi_nl for b_sel, disable expensive lensing computation
compute_lensing_1h = F
compute_lensing_2h = F

; =============================================================================
; P_OPERATOR GPU (computes P1, I1, J)
; =============================================================================

[bSelMargGPU]
file = ${Y3_CLUSTER_CPP_DIR}/release-build/src/modules/simple_gpu/bSelMargGPU.so

; Integration bounds for 3D volume: (lt, zt, lnM)
; lt (true richness) - upper bound should be max(lob_center) = 130
lt_low = 1.0
lt_high = 130.0

; zt (true redshift)
zt_low = 0.1
zt_high = 0.8

; lnM (log mass)
lnm_low = 31.0
lnm_high = 36.0

; Grid points: (zo_low, zo_high, lambda_bin)
; DES Y3 richness bins: [20,30]=0, [30,45]=1, [45,60]=2, [60,200]=3
; Using a subset for testing: one point per richness bin at z~0.4
zo_low     = 0.35 0.35 0.35 0.35
zo_high    = 0.50 0.50 0.50 0.50
lambda_bin = 0    1    2    3

; Integration settings
eps_rel = 1e-2
eps_abs = 1e-10
max_eval = 1.0e6
algorithm = pagani

; =============================================================================
; B_SEL TEST (computes b_sel(theta) for plotting)
; =============================================================================

[bSelTest]
file = ${Y3_CLUSTER_CPP_DIR}/release-build/src/modules/gpu_modules/bSelTest.so

; Grid point triplets: (lob, ltr, zob)
; Test different richness values at z=0.425 (center of [0.35,0.50] bin)
; ltr = lob means no projection bias (delta_prj = 0)
lob = 25.0  37.5  52.5  130.0
ltr = 25.0  37.5  52.5  130.0
zob = 0.425 0.425 0.425 0.425

; Theta grid for output
n_theta = 50
theta_lo = 1e-4
theta_hi = 0.1

verbose = T
